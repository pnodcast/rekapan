<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekapan by chewyzc</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFFBFE;--sage:#8FCFF2;--mint:#C9F2D6;--sky:#CDEBFF;--pink:#FFD0E8;--lav:#E6DCFF;--beige:#FFE8F2;--ink:#3B2A5A;--brown:#7A66A0;--bad:#a8505f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#FFF9EF}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#BFE4FF,#FFD9EC 55%,#DDF7E6);min-height:100vh;padding-bottom:84px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}#bg svg{width:100%;height:100%;display:block}.fy{animation:fy 6s ease-in-out infinite}@keyframes fy{50%{transform:translate(6px,-8px)}}@media(prefers-reduced-motion:reduce){.fy{animation:none}}.card.login{margin-top:12vh;text-align:center;background:linear-gradient(#FF9ACB,#FFC1E3);border-color:#FF6FB5;box-shadow:4px 4px 0 #FFD9EC}.card.login .note{color:#4a1f45}.login input{background:#FFE9F4;border-color:#FF8FC7}h1{font-family:'Bagel Fat One',Fredoka,system-ui,sans-serif;font-weight:400}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header.top h1{font-size:20px;margin:0;flex:1}
.card{background:var(--cream);border:2px solid var(--sage);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:4px 4px 0 #FFC1E3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:20px;padding:12px;border:1.5px solid #fff8}
.stat small{display:block;font-weight:500}.stat b{font-size:19px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--sage);border-radius:14px;background:#fff;margin:3px 0 8px}
label{font-size:13px;font-weight:700}
button{border:0;border-radius:999px;padding:10px 16px;background:var(--sage);font-weight:700;cursor:pointer}
button.pri{background:var(--ink);color:var(--cream)}button.del{background:var(--pink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--cream);border-top:1.5px solid var(--sage);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar a{flex:1;text-align:center;padding:9px 2px;font-size:11px;font-weight:700;color:var(--brown);cursor:pointer}
nav.bar a span{display:block;font-size:20px}nav.bar a.on{color:var(--ink);background:var(--mint)}
.o{border-top:1px dashed var(--sage);padding:9px 0}.o:first-child{border:0}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--lav);margin-right:4px}.tag.good{background:#BFE3B8;color:#245a2c}.tag.bad{background:#F2B8BE;color:#7a2230}.tag.wait{background:#FBE9A8;color:#6b5a1a}.pf{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1.5px solid var(--sage);vertical-align:middle}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bars i{flex:1;background:var(--sage);border-radius:6px 6px 0 0;min-height:2px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;z-index:9;display:none}
.note{font-size:12px;color:var(--brown)}.empty{text-align:center;padding:22px 8px;color:var(--brown)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:no-preference){.float{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body>
<div id="bg" aria-hidden="true"></div>
<div id="toast"></div><main id="app"></main>
<nav class="bar" id="nav"></nav>
<script>
const K='rekapan_v1';let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{orders:[],master:{produk:['Netflix','Canva','Disney+'],tipe:['Personal','Sharing','Family'],durasi:['1 bulan','3 bulan','1 tahun'],sumber:['Shopee','WhatsApp','Instagram']},klaim:[]};
const cache={};let uref=null,unsub=null;const js=o=>JSON.stringify(o,Object.keys(o).sort());
const save=()=>{if(!uref)return;const ids=new Set(S.orders.map(o=>o.id));S.orders.forEach(o=>{const j=js(o);if(cache[o.id]!==j){cache[o.id]=j;uref.collection('orders').doc(o.id).set(o).catch(()=>toast('Gagal menyimpan, cek internet'))}});Object.keys(cache).forEach(id=>{if(id!=='__m'&&!ids.has(id)){delete cache[id];uref.collection('orders').doc(id).delete().catch(()=>{})}});const m=JSON.stringify(S.master);if(cache.__m!==m){cache.__m=m;uref.collection('meta').doc('master').set({d:m}).catch(()=>toast('Gagal menyimpan pilihan'))}};
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const tg=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const real=o=>o.bayar==='Lunas'&&o.status!=='Batal';
const laba=o=>real(o)?o.jual-o.modal-(o.refund||0):0;
const gEnd=o=>{const d=new Date(o.gMulai);d.setDate(d.getDate()+(+o.gHari||0));return d.toISOString().slice(0,10)};
const gStat=o=>{if(!o.gHari)return'Tanpa garansi';const b=bk(o);if(b==='void')return'Garansi hangus';if(b==='wait')return'Menunggu bukti';if(o.status==='Klaim')return'Klaim garansi';const t=today(),e=gEnd(o);if(t<o.gMulai)return'Belum dimulai';if(t>e)return'Berakhir';return(new Date(e)-new Date(t))/864e5<=3?'Mendekati akhir':'Aktif'};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const tabs=[['dash','🌿','Beranda'],['orders','📜','Order'],['add','🌼','Tambah'],['rekap','🍄','Rekap'],['garansi','🛡️','Garansi'],['kelola','🧺','Kelola']];
let page='login',periode='bulan',q='';
function go(p){if(p!=='add')editId=null;page=p;render()}
function render(){
document.getElementById('nav').innerHTML=tabs.map(t=>`<a class="${t[0]===page?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</a>`).join('');
document.getElementById('app').innerHTML=({login,dash,orders,add,rekap,garansi,kelola})[page]();document.getElementById('nav').style.display=page==='login'?'none':'flex';setBg(page==='login'?'login':'app');if(page==='add'&&editId)fillF();scrollTo(0,0)}
const head=t=>`<header class="top"><span class="float" style="font-size:30px;color:#FF8FC7">✦</span><span hidden>🍃</span><h1>${t}<br><small class="note">Rekapan by chewyzc · ${tg(today())}</small></h1></header>`;
function inRange(o){const d=o.tgl,t=today(),m=t.slice(0,7);if(periode==='hari')return d===t;if(periode==='6'){const x=new Date();x.setMonth(x.getMonth()-5,1);return d>=x.toISOString().slice(0,10)}if(periode==='7')return d>=new Date(Date.now()-6*864e5).toISOString().slice(0,10);if(periode==='lalu'){const x=new Date();x.setMonth(x.getMonth()-1,1);return d.slice(0,7)===x.toISOString().slice(0,7)}return d.slice(0,7)===m}
function sum(l){const r=l.filter(real);return{n:l.length,omzet:r.reduce((a,o)=>a+o.jual,0),modal:r.reduce((a,o)=>a+o.modal,0),laba:l.reduce((a,o)=>a+laba(o),0),pend:l.filter(o=>o.bayar!=='Lunas'&&o.status!=='Batal').length}}
function dash(){const l=S.orders.filter(inRange),s=sum(l),td=S.orders.filter(o=>o.tgl===today()),g=S.orders.filter(o=>['Aktif','Mendekati akhir'].includes(gStat(o))),near=S.orders.filter(o=>gStat(o)==='Mendekati akhir');
const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);return S.orders.filter(o=>o.tgl===d).length}),mx=Math.max(1,...days);
const c=['#FFD0E8','#CDEBFF','#C9F2D6','#FFD0E8','#CDEBFF','#C9F2D6'];
const st=[['Order periode',s.n],['Omzet',rp(s.omzet)],['Modal',rp(s.modal)],['Laba',rp(s.laba)],['Order hari ini',td.length],['Pending bayar',s.pend],['Dalam garansi',g.length]];
return head('Hi, Dopiee!')+`<select onchange="periode=this.value;render()">${[['hari','Hari ini'],['7','7 hari terakhir'],['bulan','Bulan ini'],['lalu','Bulan lalu'],['6','6 bulan terakhir']].map(x=>`<option value="${x[0]}" ${periode===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>
<div class="grid">${st.map((x,i)=>`<div class="stat" style="background:${c[i%6]};position:relative"><span style="position:absolute;right:8px;top:8px">${SI[i%7]}</span><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div class="card" style="margin-top:12px"><b>Order 14 hari terakhir</b><div class="bars">${days.map(d=>`<i style="height:${d/mx*100}%" title="${d}"></i>`).join('')}</div></div>
${near.length?`<div class="card" style="background:var(--pink)">⏰ ${near.length} garansi mendekati akhir: ${near.map(o=>esc(o.nama)).join(', ')}</div>`:''}
<div class="card"><b>Order terbaru</b>${S.orders.length?S.orders.slice(-4).reverse().map(row).join(''):'<div class="empty">🌱 Belum ada order. Tambahkan yang pertama lewat menu Tambah.</div>'}</div>`}
const row=o=>`<div class="o"><div class="row"><b>${esc(o.nama)}</b><span class="sp"></span><b>${rp(o.jual)}</b></div><div class="note">${esc(o.id)} · ${esc(o.produk)} ${esc(o.tipe)} · ${esc(o.durasi)} · ${tg(o.tgl)}</div><span class="tag">${o.bayar}</span><span class="tag">${o.status}</span><span class="tag ${gc(o)}">${gStat(o)}</span>${o.bukti?`<img class="pf" src="${o.bukti}" alt="Bukti login ${esc(o.nama)}">`:''}</div>`;
function orders(){const l=S.orders.filter(o=>!q||[o.nama,o.wa,o.email,o.id,o.produk].join(' ').toLowerCase().includes(q.toLowerCase())).reverse();
return head('Data Order')+`<input placeholder="Cari nama, WA, email, ID, produk…" value="${esc(q)}" autocomplete="off" oninput="q=this.value;document.getElementById('ol').innerHTML=olist()"><div class="row"><button onclick="exp()">Ekspor CSV</button></div>
<div class="card" id="ol" style="margin-top:10px">${l.length?l.map(o=>row(o)+`<div class="row"><span class="note">Laba ${rp(laba(o))}</span><span class="sp"></span><button onclick="ed('${o.id}')">Edit</button><button onclick="up('${o.id}')">Bukti</button><button onclick="dup('${o.id}')">Duplikat</button><button onclick="nextSt('${o.id}')">Status ➜</button><button class="del" onclick="hapus('${o.id}')">Hapus</button></div>`).join(''):'<div class="empty">Tidak ada order yang cocok.</div>'}</div>`}
function nextSt(id){const o=S.orders.find(x=>x.id===id),a=['Pending','Diproses','Selesai','Klaim','Batal'];o.status=a[(a.indexOf(o.status)+1)%a.length];save();render()}
function hapus(id){if(confirm('Hapus order '+id+'? Tindakan ini tidak bisa dibatalkan.')){S.orders=S.orders.filter(o=>o.id!==id);save();render();toast('Order dihapus')}}
function dup(id){const o={...S.orders.find(x=>x.id===id),id:nid(),dibuat:Date.now(),bukti:null,buktiAt:null,tgl:today(),gMulai:today()};S.orders.push(o);save();render();toast('Order diduplikasi')}
const nid=()=>'ORD-'+Date.now().toString(36).toUpperCase();
function exp(){const h=['id','tgl','nama','wa','email','produk','tipe','durasi','sumber','admin','jual','modal','bayar','status'];const c=[h.join(',')].concat(S.orders.map(o=>h.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='order.csv';a.click()}
const opt=(k,v)=>S.master[k].map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function add(){return head(editId?'Edit Order':'Tambah Order')+`<div class="card"><form id="f" onsubmit="return false">
<label>Nama pelanggan *</label><input name="nama"><label>WhatsApp *</label><input name="wa" inputmode="tel"><label>Email pelanggan</label><input name="email" type="email">
<label>Produk</label><select name="produk">${opt('produk')}</select><label>Tipe akun</label><select name="tipe">${opt('tipe')}</select><label>Durasi</label><select name="durasi">${opt('durasi')}</select><label>Sumber penjualan</label><select name="sumber">${opt('sumber')}</select>
<label>Admin/FH</label><input name="admin"><label>Harga jual (Rp) *</label><input name="jual" type="number" min="0" inputmode="numeric" oninput="pv()"><label>Modal (Rp) *</label><input name="modal" type="number" min="0" inputmode="numeric" oninput="pv()">
<div class="note" id="pv">Laba: Rp0</div>
<label>Metode bayar</label><select name="metode"><option>QRIS</option><option>Transfer</option><option>E-wallet</option></select><label>Status bayar</label><select name="bayar"><option>Lunas</option><option>Belum</option></select>
<label>Mulai garansi</label><input name="gMulai" type="date" value="${today()}"><label>Garansi (hari)</label><input name="gHari" type="number" min="0" value="30"><label>Catatan</label><textarea name="cat" rows="2"></textarea><label>Bukti login berhasil (screenshot)</label><input name="bukti" type="file" accept="image/jpeg,image/png,image/webp"><div class="note" style="margin-bottom:8px">Unggah maksimal 24 jam setelah order disimpan. Ada bukti tepat waktu: garansi aktif (hijau). Tidak ada atau terlambat: garansi hangus (merah). Bisa diunggah belakangan lewat tombol Bukti di menu Order.</div>
<div class="row"><button class="pri" id="sv" onclick="submitO(false)">Simpan order</button><button onclick="submitO(true)">Simpan &amp; tambah lagi</button><button class="del" onclick="go('orders')">Batal</button></div></form></div>`}
function pv(){const f=document.forms.f;document.getElementById('pv').textContent='Laba: '+rp(f.jual.value-f.modal.value)}
async function submitO(again){const f=document.forms.f,v=Object.fromEntries(new FormData(f));if(!v.nama.trim()||!v.wa.trim()||v.jual===''||v.modal===''){return toast('Lengkapi nama, WA, harga jual, dan modal')}
if(v.email&&!/^\S+@\S+\.\S+$/.test(v.email))return toast('Format email salah');
const fl=f.bukti.files[0];delete v.bukti;let b=null;if(fl){if(!/^image\/(jpeg|png|webp)$/.test(fl.type))return toast('Bukti harus JPG, PNG, atau WEBP');if(fl.size>8e6)return toast('Ukuran foto maksimal 8 MB');try{b=await shrink(fl)}catch(e){return toast('Foto gagal dibaca')}}const now=Date.now();
if(editId){const o=S.orders.find(x=>x.id===editId);Object.assign(o,{...v,jual:+v.jual,modal:+v.modal,gHari:+v.gHari});if(b){o.bukti=b;o.buktiAt=now}save();toast('Perubahan tersimpan');editId=null;return go('orders')}
S.orders.push({...v,id:nid(),dibuat:now,bukti:b,buktiAt:b?now:null,tgl:today(),jual:+v.jual,modal:+v.modal,gHari:+v.gHari,status:'Pending',refund:0});save();toast('Order tersimpan 🌼');again?add_r():go('orders')}
const add_r=()=>{page='add';render()};
function rekap(){const by={};S.orders.forEach(o=>{(by[o.tgl]=by[o.tgl]||[]).push(o)});const ds=Object.keys(by).sort().reverse().slice(0,10);
const pr={};S.orders.filter(real).forEach(o=>pr[o.produk]=(pr[o.produk]||0)+1);const top=Object.entries(pr).sort((a,b)=>b[1]-a[1])[0];
const m=today().slice(0,7),sm=sum(S.orders.filter(o=>o.tgl.slice(0,7)===m));
return head('Rekap')+`<div class="card"><b>Bulan ini</b><p>${sm.n} order · Omzet ${rp(sm.omzet)} · Modal ${rp(sm.modal)}<br>Laba ${rp(sm.laba)}${top?`<br>Produk terlaris: ${esc(top[0])} (${top[1]})`:''}</p><div class="note">Hanya order lunas &amp; tidak batal dihitung sebagai omzet.</div></div>
<div class="card"><b>Rekap harian</b>${ds.length?ds.map(d=>{const s=sum(by[d]);return`<div class="o"><b>${tg(d)}</b><div class="note">${s.n} order · pending ${s.pend} · omzet ${rp(s.omzet)} · laba ${rp(s.laba)}</div></div>`}).join(''):'<div class="empty">Belum ada data untuk direkap.</div>'}</div>`}
function garansi(){const l=S.orders.filter(o=>o.gHari);return head('Garansi')+`<div class="card">${l.length?l.map(o=>`<div class="o"><b>${esc(o.nama)}</b> <span class="tag ${gc(o)}">${gStat(o)}</span><div class="note">${esc(o.produk)} · ${tg(o.gMulai)} s/d ${tg(gEnd(o))}</div></div>`).join(''):'<div class="empty">Belum ada garansi aktif.</div>'}</div>`}
function kelola(){const L={produk:'Produk',tipe:'Tipe akun',durasi:'Durasi',sumber:'Sumber penjualan'};
return head('Kelola')+Object.keys(L).map(k=>`<div class="card"><b>${L[k]}</b><div>${S.master[k].map((x,i)=>`<span class="tag">${esc(x)} <a onclick="delM('${k}',${i})" style="cursor:pointer">✕</a></span>`).join('')}</div><div class="row" style="margin-top:8px"><input id="m_${k}" placeholder="Tambah ${L[k].toLowerCase()}" style="flex:1;margin:0"><button onclick="addM('${k}')">Tambah</button></div></div>`).join('')+`<div class="card"><button onclick="imp()">Impor data lama dari browser ini</button></div><div class="card"><button class="del" onclick="logout()">Keluar</button></div><div class="card note"><b>Catatan prototipe</b><br>Data tersimpan online di akunmu dan sinkron di semua perangkat. Penyimpanan kredensial akun digital terenkripsi belum ada.</div>`}
function addM(k){const v=document.getElementById('m_'+k).value.trim();if(!v)return toast('Isi nama dulu');if(S.master[k].includes(v))return toast('Sudah ada');S.master[k].push(v);save();render()}
function delM(k,i){if(confirm('Hapus pilihan ini? Order lama tetap menyimpan namanya.')){S.master[k].splice(i,1);save();render()}}
const cl=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".92"><ellipse rx="34" ry="12"/><circle cx="-12" cy="-8" r="14"/><circle cx="8" cy="-12" r="17"/><circle cx="24" cy="-4" r="10"/></g>`;
const tr=(x,y,s,c='#8fae88')=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" width="6" height="22" fill="#b79b82"/><circle cy="-8" r="20" fill="${c}"/><circle cx="-12" cy="2" r="13" fill="${c}"/><circle cx="13" cy="3" r="13" fill="#a9c4a1"/></g>`;
const fw=(x,y,c)=>`<g transform="translate(${x} ${y})"><path d="M0 0v10" stroke="#8fae88" stroke-width="1.5"/><g fill="${c}"><circle cy="-3" r="2.6"/><circle cx="3" r="2.6"/><circle cx="-3" r="2.6"/><circle cy="3" r="2.6"/></g><circle r="1.8" fill="#FBE9A8"/></g>`;
const mu=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" width="8" height="9" rx="3" fill="#FFF9EF"/><path d="M-13 1a13 11 0 0 1 26 0z" fill="#F3DCE4"/><circle cx="-5" cy="-4" r="1.8" fill="#fff"/><circle cx="4" cy="-6" r="1.4" fill="#fff"/></g>`;
const bf=(x,y,c)=>`<g class="fy"><g transform="translate(${x} ${y})"><ellipse cx="-4" rx="5" ry="3.5" fill="${c}" transform="rotate(-20)"/><ellipse cx="4" rx="5" ry="3.5" fill="${c}" transform="rotate(20)"/></g></g>`;
